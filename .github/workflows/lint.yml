name: Lint

on:
  - push
  - pull_request

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # htcondor<24 has no wheels for newer versions
          python-version: "3.13"
          enable-cache: true
      - name: Run ruff
        run: uv run --locked ruff check --output-format=github joblib_htcondor/
