version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    # Only update uv.lock, the pins in pyproject.toml are changed by hand
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"
